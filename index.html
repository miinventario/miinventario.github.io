/* Layout: app móvil de una columna con barra de pestañas abajo. Identidad de Consultoría de Belleza (toolkit CB 2026): cereza, naranja Natura, rosa Avon, gradiente cálido y puntos naranja. Un solo tema claro, a propósito.
   v3: pensada para Consultoras que no son digitales: letra más grande, preguntas en lenguaje simple, todo en pesos (sin porcentajes) y tutorial al entrar.
   v4: solo lo esencial (Inicio y Mis productos). Clientes y "¿A quién vendo?" quedan para una segunda fase */
:root{
  color-scheme:light;
  --bg:#FBF5F7; --surface:#FFFFFF; --ink:#262625; --muted:#6E5A62; --line:#EEDFE5;
  --cereza:#AE0025; --naranja:#FF6000; --rosa:#E5004B; --rosa-claro:#FF8EC5; --rosa-bg:#F5E4EF;
  --accent:#AE0025; --accent-soft:#F5E4EF; --ok:#1F7A4D; --ok-soft:#E3F3EA; --warn:#B34700; --warn-soft:#FFEADB; --bad:#AE0025; --bad-soft:#FBE3E8;
  --font:"Natura Text",system-ui,-apple-system,"Segoe UI",sans-serif; --display:"Natura Display","Natura Text",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}

header.top{padding:6px 0 4px;color:#fff;display:flex;flex-direction:column;gap:14px}
header.top .brand{display:flex;justify-content:flex-end}
header.top .brand img{width:138px;height:auto}
header.top #hello{color:#fff;opacity:.9;font-size:1rem}
header.top h1{color:var(--rosa-claro)}
.dots{display:flex;gap:7px;align-items:center;margin-top:2px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--naranja)}
.dots i:nth-child(2n){width:7px;height:7px}
.dots i:nth-child(3n){width:13px;height:13px}
h1{font-family:var(--display);font-size:1.9rem;font-weight:700;margin:0;letter-spacing:.01em;text-transform:uppercase;line-height:1;text-wrap:balance}
h2{font-family:var(--display);font-size:1.3rem;font-weight:700;margin:0;text-wrap:balance}
h3{font-size:1.05rem;font-weight:700;margin:0}
p{margin:0}
.muted{color:var(--muted);font-size:.92rem}
.sample{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff;color:var(--warn);border-radius:12px;padding:10px 12px;font-size:.92rem;font-weight:600}
.sample button{flex:none}
.banner{background:#fff;color:var(--cereza);border-radius:12px;padding:12px;font-size:.95rem;font-weight:600;display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.money-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-top:10px;border-top:1px solid var(--line)}
.money-row:first-of-type{border-top:none;padding-top:0}
.money-row span{font-size:.95rem}
.money-row b{font-family:var(--display);font-size:1.25rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.money-row.gain b{color:var(--naranja);font-size:1.5rem}
.month{background:var(--naranja);color:#fff;border-radius:14px;padding:16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.month b{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.month span{font-size:.95rem;font-weight:600}
.bigbtns{display:grid;gap:8px}
.bigbtn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:1.05rem;font-weight:700;text-align:left;width:100%}
.bigbtn .ic{width:42px;height:42px;border-radius:50%;background:var(--cereza);color:#fff;display:grid;place-items:center;flex:none;font-size:1.4rem;line-height:1}
.bigbtn small{display:block;font-weight:400;font-size:.85rem;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:.95rem}
.bar .track{grid-column:1/-1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--cereza),var(--naranja));border-radius:99px}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:.95rem}
.alert.warn{background:var(--warn-soft)} .alert.bad{background:var(--bad-soft)} .alert.ok{background:var(--ok-soft)}
.alert a,.why a{color:var(--accent);font-weight:700}
.pill{display:inline-flex;align-items:center;font-size:.76rem;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.acc{background:var(--accent-soft);color:var(--accent)} .pill.n{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.item.out{opacity:.7}
.item .name{font-weight:700;overflow-wrap:anywhere}
.item .meta{font-size:.9rem;color:var(--muted)}
.money{font-variant-numeric:tabular-nums;font-weight:700}
.qty{display:flex;align-items:center;gap:6px;flex:none}
.item > .row.between{flex-wrap:nowrap;align-items:flex-start}
.item > .row.between .name{flex:1;min-width:0}
.qty b{min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
button,.btn{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;font-weight:600;font-size:.95rem}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button.primary,a.btn.primary{background:var(--cereza);color:#fff;border-color:var(--cereza);border-radius:99px;padding:13px 18px;font-size:1rem}
button.small,.btn.small{padding:6px 12px;font-size:.9rem}
button.round{width:36px;height:36px;padding:0;border-radius:50%;font-size:1.2rem;line-height:1}
button.link{border:none;background:none;color:var(--accent);padding:4px 0;text-decoration:underline;font-size:.9rem}
button[data-armed="1"]{color:var(--bad);font-weight:800}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.88rem;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.cat{border-radius:12px;text-align:left;padding:8px 12px}
.chip.cat small{display:block;font-weight:400;font-size:.76rem;opacity:.85}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg .chip{border-radius:10px;text-align:center}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filters .chip{flex:none}
/* v4.1: las dos secciones van arriba como un selector grande; la barra de abajo con dos pestañas casi no se veía */
nav.switch{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);padding:5px;border-radius:18px}
nav.switch button{display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;background:none;color:#fff;font-size:1.02rem;font-weight:700;padding:14px 8px}
nav.switch button svg{width:24px;height:24px;flex:none}
nav.switch button[aria-current="page"]{background:#fff;color:var(--cereza);box-shadow:0 2px 8px rgba(60,0,15,.18)}
.sheet{position:fixed;inset:0;background:rgba(20,10,16,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet .panel{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
form{display:flex;flex-direction:column;gap:14px}
label,.field{display:flex;flex-direction:column;gap:6px;font-size:.98rem;font-weight:700;color:var(--ink);min-width:0}
.hint{font-size:.85rem;color:var(--muted);font-weight:400}
input,select,textarea{font:inherit;font-size:1.05rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0}
input[type="search"]{background:#fff}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px}
.stepper button{font-size:1.5rem;padding:0;height:52px;border-radius:12px;line-height:1}
.stepper input{text-align:center;font-size:1.25rem;font-weight:700}
.calc{background:var(--accent-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.calc .big{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:700}
.calc b{font-family:var(--display);color:var(--cereza);font-size:1.35rem;font-variant-numeric:tabular-nums}
.calc .warnline{color:var(--warn);font-size:.88rem;font-weight:700}
details.more{border-top:1px solid var(--line);padding-top:8px}
details.help{border:none;padding:0;margin-top:-6px;background:var(--bg);border-radius:10px;padding:2px 12px}
details.help[open]{padding-bottom:12px}
details.more summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:.98rem;padding:6px 0}
details.more[open] summary{margin-bottom:10px}
details.more > div{display:flex;flex-direction:column;gap:14px}
.empty{text-align:center;padding:28px 12px;color:var(--muted);background:var(--surface);border-radius:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.rank{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
.rank:first-child{border-top:none;padding-top:0}
.rank .n{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:.9rem}
.rank .acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.why{font-size:.85rem;color:var(--muted)}
.sale{display:grid;grid-template-columns:1fr auto;gap:10px;font-size:.95rem;padding-top:10px;border-top:1px solid var(--line)}
.sale .r{text-align:right}
.pick{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:14px;border-radius:12px;width:100%}
.pick span{color:var(--muted);font-weight:400;font-size:.9rem;white-space:nowrap}
.tut{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:4px 0}
.tut .count{font-size:.85rem;color:var(--muted);font-weight:700}
.tut-ico{width:88px;height:88px;border-radius:50%;background:var(--accent-soft);color:var(--cereza);display:grid;place-items:center}
.tut-ico svg{width:46px;height:46px}
.tut p{font-size:1.08rem;max-width:34ch}
.tut .pager{display:flex;gap:6px}
.tut .pager i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.tut .pager i.on{background:var(--naranja);width:22px;border-radius:99px}
.tut .row{width:100%}
.tut .row button{flex:1}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.step .num{width:34px;height:34px;border-radius:50%;background:var(--naranja);color:#fff;display:grid;place-items:center;font-weight:800}
.step > div{display:flex;flex-direction:column;gap:8px}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:.95rem;font-weight:600;z-index:20;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet .panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
#view > .list > p.muted{color:#fff;opacity:.92}
#view > .list > label{color:#fff}
</style>
</head>

    <span>Estás abriendo la herramienta dentro de <span id="iabApp"></span>. Aquí lo que anotes se puede borrar. Ábrela en Chrome o Safari.</span>
    <div class="row"><button class="small" data-act="copyLink">Copiar link</button></div>
  </div>
  <div class="sample" id="sampleBar" hidden>
    <span>Esto es un ejemplo.</span>
    <button class="small" data-act="clearSample">Empezar con los míos</button>
  </div>
  <main id="view"></main>
</div>


<div class="sheet" id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>

<script>
(function(){
const KEY="mi-inventario-v1";
const CATS=["Cuidado diario y cabello","Maquillaje","Perfumería","Lanzamientos","Otros"];
const CAT_EJ={"Cuidado diario y cabello":"cremas, jabones, shampoo","Maquillaje":"labiales, bases, pestañinas","Perfumería":"perfumes y colonias","Lanzamientos":"lo nuevo del ciclo","Otros":"lo que no esté arriba"};
const NIVELES=["Bronce","Plata","Oro","Zafiro","Diamante"];
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const $=s=>document.querySelector(s);
const fmt=n=>new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(Math.round(n||0));
const sum=(a,f)=>a.reduce((s,x)=>s+(f(x)||0),0);
// Fechas en hora local: en Colombia, desde las 7 p. m. la hora UTC ya es el día siguiente
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>iso(new Date());
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return iso(d)}
const days=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);
const fdate=(s,y)=>{if(!s)return "";const [Y,M,D]=s.split("-").map(Number);return D+" "+MESES[M-1].slice(0,3)+(y?" "+Y:"")};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const plain=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const ios=/iPhone|iPad|iPod/i.test(navigator.userAgent);
const ICON={
  caja:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',
  plata:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/></svg>',
  venta:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4.5 4.5L19 7"/></svg>',
  cel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>'
};

function sample(){
  const p=[
    {id:"p1",nombre:"Crema corporal Avon Care Coco 1.000 ml",categoria:"Cuidado diario y cabello",cantidad:4,precioVenta:32990,pague:20500,vence:addDays(240)},
    {id:"p2",nombre:"Emily in Paris · Café Gourmand",categoria:"Perfumería",cantidad:3,precioVenta:45990,pague:23990,vence:""},
    {id:"p3",nombre:"Emily in Paris · Macaron Amour",categoria:"Perfumería",cantidad:1,precioVenta:45990,pague:23990,vence:""},
    {id:"p4",nombre:"Labial Hydramatic Matte Magenta",categoria:"Maquillaje",cantidad:5,precioVenta:27990,pague:17990,vence:addDays(40)},
    {id:"p5",nombre:"Shampoo Advance Techniques Nutrición Absoluta",categoria:"Cuidado diario y cabello",cantidad:2,precioVenta:19690,pague:11998,vence:addDays(300)},
    {id:"p6",nombre:"Pack 4 colonias para niños",categoria:"Lanzamientos",cantidad:1,precioVenta:59990,pague:35990,vence:""}
  ];
  const v=[
    {id:"v1",producto:"p4",nombre:"Labial Hydramatic Matte Magenta",cliente:"",clienteNombre:"",cantidad:2,precio:27990,ganancia:20000,fecha:addDays(-1)},
    {id:"v2",producto:"p2",nombre:"Emily in Paris · Café Gourmand",cliente:"",clienteNombre:"",cantidad:1,precio:45990,ganancia:22000,fecha:today()}
  ];
  return {sample:true,perfil:{nivel:"Oro"},productos:p,clientes:[],ventas:v};
}
// Acepta datos guardados por versiones anteriores y copias recuperadas
function norm(o){
  if(!o||typeof o!=="object"||!Array.isArray(o.productos))return null;
  o.perfil={nivel:NIVELES.includes(o.perfil&&o.perfil.nivel)?o.perfil.nivel:"Bronce"};
  o.clientes=Array.isArray(o.clientes)?o.clientes:[];
  o.ventas=Array.isArray(o.ventas)?o.ventas:[];
  o.ventas.forEach(v=>{if(!v.nombre){const p=o.productos.find(x=>x.id===v.producto);v.nombre=p?p.nombre:"Producto"}});
  return o;
}
let S,primeraVez=false;
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=norm(JSON.parse(r));if(o)return o}}catch(e){}primeraVez=true;return sample()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
S=load();
let tab="inicio",filtro="Todas",qInv="",pendiente=null,onPick=null;

function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function ganancia(p){return (p.precioVenta||0)-(p.pague||0)}
const linkApp=()=>location.href.split("#")[0];

function render(){
  document.querySelectorAll("nav.switch button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
  $("#sampleBar").hidden=!S.sample;
  $("#view").innerHTML=({inicio:vInicio,inventario:vInventario})[tab]();
}

function vInicio(){
  const P=S.productos,cant=p=>+p.cantidad||0;
  const invertiste=sum(P,p=>(p.pague||0)*cant(p)),recibes=sum(P,p=>(p.precioVenta||0)*cant(p)),gan=recibes-invertiste;
  const mes=today().slice(0,7),VM=S.ventas.filter(v=>(v.fecha||"").slice(0,7)===mes),ganMes=sum(VM,v=>v.ganancia);
  // La categoría es opcional: el panel solo aparece si se usó
  const porCat=c=>sum(P.filter(p=>p.categoria===c),cant),max=Math.max(1,...CATS.map(porCat));
  const bars=CATS.map(c=>{const n=porCat(c);
    return n?`<div class="bar"><span>${c}</span><span class="money">${n} ${n===1?"unidad":"unidades"}</span><div class="track"><div class="fill" style="width:${n/max*100}%"></div></div></div>`:""}).join("");

  // Alertas en orden de urgencia; agotados y "queda 1" van agrupados para que no tapen lo demás
  const al=[],enCasa=P.filter(p=>cant(p)>0);
  enCasa.filter(p=>p.vence&&days(today(),p.vence)<0).forEach(p=>al.push(["bad",`<b>${esc(p.nombre)}</b> ya venció.`]));
  enCasa.filter(p=>p.vence&&days(today(),p.vence)>=0&&days(today(),p.vence)<=60).sort((a,b)=>a.vence<b.vence?-1:1)
    .forEach(p=>{const d=days(today(),p.vence);al.push(["warn",`<b>${esc(p.nombre)}</b> vence ${d===0?"hoy":d===1?"mañana":"en "+d+" días"}. Véndelo primero.`])});
  const uno=P.filter(p=>cant(p)===1),cero=P.filter(p=>cant(p)===0);
  if(uno.length)al.push(["warn",uno.length===1?`Te queda 1 <b>${esc(uno[0].nombre)}</b>.`:`Te queda 1 de: ${uno.map(p=>"<b>"+esc(p.nombre)+"</b>").join(", ")}.`]);
  if(cero.length)al.push(["bad",cero.length===1?`Se te acabó <b>${esc(cero[0].nombre)}</b>. ¿Lo pides en tu próximo pedido?`:`Se te acabaron: ${cero.map(p=>"<b>"+esc(p.nombre)+"</b>").join(", ")}. ¿Los pides en tu próximo pedido?`]);
  const conDatos=!S.sample&&P.length;
  if(conDatos&&(!S.ultimaCopia||days(S.ultimaCopia,today())>=14))al.push(["warn",`${S.ultimaCopia?"Hace "+days(S.ultimaCopia,today())+" días no guardas":"Todavía no has guardado"} una copia de lo que anotaste. <button class="link" data-act="backup">Guardar copia</button>`]);

  const ult=[...S.ventas].reverse().slice(0,5);
  const ventas=ult.length?ult.map(v=>`<div class="sale"><span><b>${esc(v.nombre)}</b>${v.cantidad>1?" × "+v.cantidad:""}<br><span class="muted">${fdate(v.fecha)}</span></span><span class="r"><span class="money">+${fmt(v.ganancia)}</span><br><button class="link" data-undo="${v.id}" data-confirm="¿Deshacer? Toca otra vez">Deshacer</button></span></div>`).join(""):`<p class="muted">Cuando anotes una venta, aquí ves lo que vas ganando.</p>`;

  return `<div class="list">
  <div class="card">
    <h3>Lo que tienes en casa</h3>
    <div class="money-row"><span>Invertiste</span><b>${fmt(invertiste)}</b></div>
    <div class="money-row"><span>Si lo vendes todo, recibes</span><b>${fmt(recibes)}</b></div>
    <div class="money-row gain"><span>Vas a ganar</span><b>${fmt(gan)}</b></div>
  </div>
  <div class="month"><span>Este mes ya ganaste<br><small>${VM.length} ${VM.length===1?"venta anotada":"ventas anotadas"} en ${MESES[new Date().getMonth()]}</small></span><b>${fmt(ganMes)}</b></div>
  <div class="bigbtns">
    <button class="bigbtn" data-go="nuevoProducto"><span class="ic">+</span><span>Anotar lo que compré<small>Con tu factura en la mano</small></span></button>
    <button class="bigbtn" data-act="pickVenta"><span class="ic">✓</span><span>Anotar una venta<small>Se descuenta de lo que tienes</small></span></button>
  </div>
  <div class="card"><h3>Para hoy</h3><div class="alerts">${al.length?al.map(a=>`<div class="alert ${a[0]}"><span>${a[1]}</span></div>`).join(""):`<p class="muted">Todo en orden. No hay productos por vencer ni por acabarse.</p>`}</div></div>
  <div class="card"><h3>Mis últimas ventas</h3>${ventas}</div>
  ${bars?`<div class="card"><h3>Lo que tienes, por categoría</h3><div class="bars">${bars}</div></div>`:""}
  <div class="card"><h3>¿Cómo funciona?</h3><p class="muted">Mira en cuatro pasos cómo usar la herramienta.</p><div class="row"><button class="small primary" data-tut="0">Ver cómo funciona</button></div></div>
  <div class="card"><h3>No pierdas tu herramienta</h3><p class="muted">Envíate el link por WhatsApp y ponla en la pantalla de tu celular, como cualquier app.</p><div class="row"><button class="small primary" data-act="sendLink">Enviarme el link</button><button class="small" data-act="guiaCel">Ponerla en mi celular</button></div></div>
  <div class="card"><h3>Lo que anotas</h3><p class="muted">Se guarda solo en este celular y nadie más lo ve. Si cambias de celular o borras el navegador, se pierde. Por eso, guarda una copia cada tanto: puedes mandártela por WhatsApp.</p><p class="muted">${S.ultimaCopia?"Última copia: "+fdate(S.ultimaCopia,1)+".":"Todavía no has guardado una copia."}</p><div class="row"><button class="small primary" data-act="backup">Guardar copia</button><button class="small" data-act="restore">Recuperar copia</button></div></div>
  <div class="card"><h3>¿Prefieres anotar en papel?</h3><p class="muted">Descarga el formato, imprímelo y llénalo a mano: lo que compraste y lo que vendiste.</p><div class="row"><a class="btn small" href="formato-imprimible.pdf" download target="_blank" rel="noopener">Descargar formato</a></div></div>
  <div class="card"><div class="row between"><div><span class="muted">Mi nivel</span><h2>${esc(S.perfil.nivel)}</h2></div><button class="small" data-act="editPerfil">Cambiar</button></div></div>
  </div>`;
}

function vInventario(){
  const q=plain(qInv);
  const P=S.productos.filter(p=>(filtro==="Todas"||p.categoria===filtro)&&(!q||plain(p.nombre).includes(q)))
    .sort((a,b)=>((+b.cantidad||0)>0)-((+a.cantidad||0)>0));
  const usadas=CATS.filter(c=>S.productos.some(p=>p.categoria===c));
  const f=usadas.length>1?`<div class="filters" role="group" aria-label="Filtrar por categoría">${["Todas",...usadas].map(c=>`<button class="chip" data-filtro="${c}" aria-pressed="${filtro===c}">${c}</button>`).join("")}</div>`:"";
  const buscar=S.productos.length>5?`<input type="search" id="qInv" placeholder="Buscar producto" aria-label="Buscar producto" value="${esc(qInv)}">`:"";
  const items=P.length?P.map(p=>{
    const n=+p.cantidad||0,d=p.vence?days(today(),p.vence):null;
    const v=d===null||n===0?"":d<0?`<span class="pill bad">Vencido</span>`:d<=60?`<span class="pill warn">Vence en ${d} días</span>`:`<span class="pill n">Vence ${fdate(p.vence,1)}</span>`;
    return `<div class="item${n?"":" out"}">
      <div class="row between"><span class="name">${esc(p.nombre)}</span><div class="qty"><button class="round" data-menos="${p.id}" aria-label="Quitar una unidad">−</button><b>${n}</b><button class="round" data-mas="${p.id}" aria-label="Agregar una unidad">+</button></div></div>
      ${p.categoria||!n||v?`<div class="row">${p.categoria?`<span class="pill acc">${esc(p.categoria)}</span>`:""}${n?"":`<span class="pill bad">Se acabó</span>`}${v}</div>`:""}
      <div class="meta">Lo vendes a <span class="money">${fmt(p.precioVenta)}</span> · ganas <span class="money">${fmt(ganancia(p))}</span> por cada uno</div>
      <div class="row"><button class="small primary" data-vender="${p.id}" ${n>0?"":"disabled"}>Vendí</button><button class="small" data-editp="${p.id}">Cambiar</button></div>
    </div>`}).join(""):`<div class="empty"><p>${q?"No encontré productos con ese nombre.":S.productos.length?"No tienes productos en esta categoría.":"Todavía no has anotado productos."}</p></div>`;
  return `<div class="list">${f}${buscar}<button class="primary" data-go="nuevoProducto">+ Anotar lo que compré</button>${items}</div>`;
}

// Selección única (categoría y "por cada uno / por todas"): va en un div, no en un label, para que tocar el título no marque la primera opción
function single(name,title,opts,val,cls,labels){return `<div class="field"><span>${title}</span><div class="${cls||"chips"}" role="radiogroup" aria-label="${esc(title)}">${opts.map(o=>`<button type="button" class="chip${cls==="chips"&&labels?" cat":""}" role="radio" data-one="${name}" data-val="${esc(o)}" aria-pressed="${o===val}" aria-checked="${o===val}">${labels?labels(o):esc(o)}</button>`).join("")}</div></div>`}
const oneVal=name=>{const b=$("#panel").querySelector(`[data-one="${name}"][aria-pressed="true"]`);return b?b.dataset.val:""};
function stepper(id,val,min){return `<div class="stepper"><button type="button" data-step="-1" data-for="${id}" aria-label="Una menos">−</button><input id="${id}" type="number" min="${min}" inputmode="numeric" value="${val}"><button type="button" data-step="1" data-for="${id}" aria-label="Una más">+</button></div>`}
function open(html){onPick=null;$("#panel").innerHTML=html;$("#sheet").hidden=false;document.body.style.overflow="hidden";$("#panel").scrollTop=0}
function close(){$("#sheet").hidden=true;document.body.style.overflow=""}
const head=t=>`<div class="row between"><h2>${t}</h2><button class="small" data-close>Cerrar</button></div>`;

function formProducto(id){
  const p=id?S.productos.find(x=>x.id===id):{nombre:"",categoria:"",cantidad:1,precioVenta:"",pague:"",vence:""};
  open(`${head(id?"Cambiar producto":"Anotar lo que compré")}
  <form id="fProd" novalidate>
    <label for="pNombre">¿Qué producto compraste?<input id="pNombre" value="${esc(p.nombre)}" placeholder="Ej: Crema Avon Care Coco 1.000 ml"></label>
    <div class="field"><span>¿Cuántas unidades compraste?</span>${stepper("pCant",p.cantidad,0)}</div>
    <label for="pVenta">¿A cómo lo vas a vender?<span class="hint">El precio de la revista, por cada uno.</span><input id="pVenta" type="number" min="0" inputmode="numeric" value="${p.precioVenta}" placeholder="Ej: 32990"></label>
    <label for="pPague">¿Cuánto pagaste?<span class="hint">Míralo en tu factura. Ese valor ya tiene descontada tu ganancia por nivel y las promociones: no tienes que restar nada.</span><input id="pPague" type="number" min="0" inputmode="numeric" value="${p.pague}" placeholder="Ej: 20500"></label>
    <div id="pModoWrap">${single("modo","Ese valor es…",["uno","todas"],"uno","seg",o=>o==="uno"?"Por cada uno":"Por todas juntas")}</div>
    <details class="more help"><summary>¿Dónde lo veo en la factura?</summary><div>${pasosFactura}</div></details>
    <div class="calc" aria-live="polite"><div class="big"><span id="cTxt">Por cada uno ganas</span><b id="cGan"></b></div><span class="muted" id="cTot"></span><span class="warnline" id="cWarn" hidden>Ojo: estás pagando más de lo que vas a cobrar.</span></div>
    <details class="more"${p.vence||p.categoria?" open":""}><summary>Más detalles (si quieres)</summary><div>
      ${single("cat","¿De qué categoría es?",CATS,p.categoria,"chips",c=>`${esc(c)}<small>${CAT_EJ[c]}</small>`)}
      <label for="pVence">¿Cuándo se vence?<span class="hint">Te avisamos dos meses antes.</span><input id="pVence" type="date" value="${p.vence||""}"></label>
    </div></details>
    <p class="warnline" id="pErr" hidden style="color:var(--bad);font-weight:700"></p>
    <button class="primary" type="submit">${id?"Guardar cambios":"Guardar"}</button>
    ${id?`<button type="button" class="link" data-delp="${id}" data-confirm="¿Seguro? Toca otra vez para borrarlo">Borrar este producto</button>`:""}
  </form>`);
  const unit=()=>{const raw=+$("#pPague").value||0,c=Math.max(1,+$("#pCant").value||1);return oneVal("modo")==="todas"?raw/c:raw};
  const upd=()=>{const v=+$("#pVenta").value||0,raw=+$("#pPague").value||0,c=+$("#pCant").value||0,g=v-unit();
    $("#pModoWrap").hidden=c<=1;
    if(!v||!raw){$("#cGan").textContent="";$("#cTxt").textContent="Escribe a cómo lo vendes y cuánto pagaste, y te digo cuánto ganas.";$("#cTot").textContent="";$("#cWarn").hidden=true;return}
    $("#cTxt").textContent="Por cada uno ganas";$("#cGan").textContent=fmt(g);
    $("#cTot").textContent=c>1?`Si vendes las ${c}, ganas ${fmt(g*c)}`:"";$("#cWarn").hidden=g>=0};
  ["#pVenta","#pPague","#pCant"].forEach(s=>$(s).addEventListener("input",upd));
  onPick=upd;upd();
  $("#fProd").addEventListener("submit",e=>{e.preventDefault();
    const err=$("#pNombre").value.trim()?"":"Escribe el nombre del producto.";
    if(err){$("#pErr").textContent=err;$("#pErr").hidden=false;return}
    const n={id:id||uid(),nombre:$("#pNombre").value.trim(),categoria:oneVal("cat"),cantidad:Math.max(0,+$("#pCant").value||0),precioVenta:+$("#pVenta").value||0,pague:Math.round(unit()),vence:$("#pVence").value};
    if(id)S.productos=S.productos.map(x=>x.id===id?n:x);else S.productos.unshift(n);
    save();close();tab="inventario";filtro="Todas";render();window.scrollTo(0,0);toast(id?"Listo, quedó guardado":"Listo, ya está en tus productos")});
}
// Ayuda en el mismo formulario para no perder lo que ya escribió
const pasosFactura=`<div class="step"><span class="num">1</span><div><b>Busca la factura de tu pedido</b><p class="muted">La que te llega con la caja, en papel o en el correo.</p></div></div>
  <div class="step"><span class="num">2</span><div><b>Encuentra el producto</b><p class="muted">Cada producto tiene su renglón con el nombre y la cantidad.</p></div></div>
  <div class="step"><span class="num">3</span><div><b>Copia el valor que pagaste</b><p class="muted">Ya tiene descontada tu ganancia por nivel y las promociones. Si es el valor de todas las unidades juntas, elige «Por todas juntas» y la herramienta hace la cuenta.</p></div></div>`;
function pickVenta(){
  const P=S.productos.filter(p=>(+p.cantidad||0)>0);
  open(`${head("¿Qué vendiste?")}${P.length?`<div class="list">${P.map(p=>`<button class="pick" data-vender="${p.id}"><b>${esc(p.nombre)}</b><span>Tienes ${p.cantidad}</span></button>`).join("")}</div>`:`<p>No tienes productos anotados en casa. Primero anota lo que compraste.</p><button class="primary" data-go="nuevoProducto">+ Anotar lo que compré</button>`}`);
}
function formVenta(pid){
  const p=S.productos.find(x=>x.id===pid);
  open(`${head("Anotar una venta")}
  <form id="fVen"><p><b>${esc(p.nombre)}</b><br><span class="muted">Tienes ${p.cantidad} en casa</span></p>
    <div class="field"><span>¿Cuántas vendiste?</span>${stepper("vCant",1,1)}</div>
    <label for="vPrecio">¿A cómo la vendiste?<span class="hint">Por cada una. Si le hiciste descuento, cámbialo.</span><input id="vPrecio" type="number" min="0" inputmode="numeric" value="${p.precioVenta||""}"></label>
    <div class="calc"><div class="big"><span>Ganaste</span><b id="vGan"></b></div></div>
    <button class="primary" type="submit">Guardar venta</button></form>`);
  const q=()=>Math.max(1,Math.min(p.cantidad,+$("#vCant").value||1)),pr=()=>+$("#vPrecio").value||0;
  const upd=()=>{if((+$("#vCant").value||0)>p.cantidad)$("#vCant").value=p.cantidad;$("#vGan").textContent=fmt((pr()-(p.pague||0))*q())};
  ["#vCant","#vPrecio"].forEach(s=>$(s).addEventListener("input",upd));upd();
  $("#fVen").addEventListener("submit",e=>{e.preventDefault();const n=q();
    p.cantidad-=n;
    S.ventas.push({id:uid(),producto:p.id,nombre:p.nombre,cliente:"",clienteNombre:"",cantidad:n,precio:pr(),ganancia:(pr()-(p.pague||0))*n,fecha:today()});
    save();close();render();toast("¡Bien! Ganaste "+fmt((pr()-(p.pague||0))*n))});
}
function formPerfil(primera){
  open(`${head(primera?"¿Cuál es tu nivel?":"Mi nivel")}
  <form id="fPer"><label for="perNivel">Tu nivel como Consultora<select id="perNivel">${NIVELES.map(n=>`<option ${n===S.perfil.nivel?"selected":""}>${n}</option>`).join("")}</select></label>
  <p class="muted">Cámbialo cuando subas de nivel.</p>
  <button class="primary" type="submit">Guardar</button></form>`);
  $("#fPer").addEventListener("submit",e=>{e.preventDefault();S.perfil={nivel:$("#perNivel").value};save();close();render()});
}

// Tutorial: se abre solo la primera vez y queda en Inicio para volver a verlo
const TUT=[
  {i:ICON.caja,t:"Anota lo que compraste",d:"Con tu factura en la mano, anota cada producto: cuántas unidades, a cómo lo vendes y cuánto pagaste."},
  {i:ICON.plata,t:"Mira cuánto vas a ganar",d:"En Inicio ves cuánto invertiste, cuánto recibes si vendes todo y cuánto ganas. Todo en pesos."},
  {i:ICON.venta,t:"Anota cada venta",d:"Toca «Anotar una venta». El producto se descuenta de lo que tienes y tu ganancia del mes sube."},
  {i:ICON.cel,t:"No pierdas tu herramienta",d:"Envíate el link por WhatsApp y ponla en la pantalla de tu celular. Lo que ves ahora es un ejemplo: toca «Empezar con los míos» para anotar lo tuyo."}
];
function tutorial(i){
  const s=TUT[i],last=i===TUT.length-1;
  open(`<div class="tut"><span class="count">Paso ${i+1} de ${TUT.length}</span><div class="tut-ico">${s.i}</div><h2>${s.t}</h2><p>${s.d}</p>
  <div class="pager" aria-hidden="true">${TUT.map((_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</div>
  <div class="row">${i?`<button data-tut="${i-1}">Atrás</button>`:`<button data-close>Saltar</button>`}${last?`<button class="primary" data-close>¡Empezar!</button>`:`<button class="primary" data-tut="${i+1}">Siguiente</button>`}</div></div>`);
}
function guiaCel(){
  const pasosIOS=`<ol class="steps"><li>Abre el link en <b>Safari</b> (la brújula azul).</li><li>Toca el botón <b>Compartir</b>: el cuadrito con una flecha hacia arriba, abajo en el centro.</li><li>Baja y toca <b>«Agregar a inicio»</b>.</li><li>Toca <b>«Agregar»</b>, arriba a la derecha.</li></ol>`;
  const pasosAnd=`<ol class="steps"><li>Abre el link en <b>Chrome</b> (el círculo de colores).</li><li>Toca los <b>tres puntos ⋮</b>, arriba a la derecha.</li><li>Toca <b>«Agregar a la pantalla principal»</b> o <b>«Instalar app»</b>.</li><li>Toca <b>«Agregar»</b>.</li></ol>`;
  open(`${head("No pierdas tu herramienta")}
  <div class="step"><span class="num">1</span><div><b>Envíate el link</b><p class="muted">Te llega a tu propio WhatsApp. Busca tu nombre o el chat «Tú» y envíalo.</p><div class="row"><button class="small primary" data-act="sendLink">Enviarme el link por WhatsApp</button></div></div></div>
  <div class="step"><span class="num">2</span><div><b>Ponla en la pantalla de tu celular</b><p class="muted">${ios?"En tu iPhone:":"En tu celular Android:"}</p>${ios?pasosIOS:pasosAnd}<p class="muted">Te aparece un ícono, como el de cualquier app.</p>
  <details class="more"><summary>${ios?"¿Tienes Android?":"¿Tienes iPhone?"}</summary><div>${ios?pasosAnd:pasosIOS}</div></details></div></div>
  <button class="primary" data-close>Listo</button>`);
}

// Copia de seguridad: en el celular abre el menú de compartir (WhatsApp, Drive, correo); si no, descarga el archivo
function backup(){
  const name=`mi-inventario-${today()}.json`,data=JSON.stringify({app:KEY,fecha:today(),datos:S});
  const done=()=>{S.ultimaCopia=today();save();render()};
  let file=null;try{file=new File([data],name,{type:"application/json"})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"Copia de mi inventario"}).then(()=>{done();toast("Copia guardada")}).catch(()=>{});return}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);done();toast("Copia descargada")}catch(e){toast("No se pudo guardar la copia en este navegador")}
}
$("#restoreFile").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const o=JSON.parse(await f.text()),d=norm(o.datos||o);if(!d)throw 0;d.sample=false;pendiente=d;
    open(`${head("Recuperar copia")}<p>La copia${o.fecha?" del "+fdate(o.fecha,1):""} tiene <b>${d.productos.length}</b> productos y <b>${d.ventas.length}</b> ventas.</p><p class="muted">Reemplaza todo lo que tienes ahora en este celular.</p><button class="primary" data-act="doRestore">Recuperar esta copia</button>`)}
  catch(_){toast("Ese archivo no es una copia de la herramienta")}});

// Navegadores internos de redes sociales: borran lo guardado con facilidad
(function(){const m=navigator.userAgent.match(/Instagram|FBAN|FBAV|FB_IAB|WhatsApp|TikTok|musical_ly|Line\//i);if(!m)return;
  const k=m[0].toLowerCase(),app=k.startsWith("fb")?"Facebook":k==="instagram"?"Instagram":k==="whatsapp"?"WhatsApp":k.startsWith("line")?"Line":"TikTok";
  $("#iabApp").textContent=app;$("#iabBar").hidden=false})();

document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-close]");if(!t)return;const d=t.dataset;
  // Acciones que borran algo piden un segundo toque
  if(d.confirm&&d.armed!=="1"){d.armed="1";d.orig=t.textContent;t.textContent=d.confirm;setTimeout(()=>{if(t.isConnected&&d.armed==="1"){d.armed="";t.textContent=d.orig}},3500);return}
  if(d.step){const i=$("#"+d.for),min=+i.min||0,max=i.max?+i.max:Infinity;i.value=Math.min(max,Math.max(min,(+i.value||0)+(+d.step)));i.dispatchEvent(new Event("input",{bubbles:true}))}
  else if(d.one){t.parentElement.querySelectorAll("[data-one]").forEach(b=>{b.setAttribute("aria-pressed",b===t);b.setAttribute("aria-checked",b===t)});const er=$("#pErr");if(er)er.hidden=true;if(onPick)onPick()}
  else if(d.tut!==undefined)tutorial(+d.tut);
  else if(d.tab){tab=d.tab;close();render();window.scrollTo(0,0)}
  else if(d.go==="nuevoProducto")formProducto();
  else if(d.filtro){filtro=d.filtro;render()}
  else if(d.mas||d.menos){const p=S.productos.find(x=>x.id===(d.mas||d.menos));p.cantidad=Math.max(0,(+p.cantidad||0)+(d.mas?1:-1));save();render()}
  else if(d.vender)formVenta(d.vender);
  else if(d.editp)formProducto(d.editp);
  else if(d.delp){S.productos=S.productos.filter(x=>x.id!==d.delp);save();close();render();toast("Producto borrado")}
  else if(d.undo){const i=S.ventas.findIndex(v=>v.id===d.undo);if(i<0)return;const v=S.ventas[i],p=S.productos.find(x=>x.id===v.producto),c=S.clientes.find(x=>x.id===v.cliente);
    if(p)p.cantidad=(+p.cantidad||0)+v.cantidad;
    if(c&&c.ultima===v.fecha&&"prevUltima" in v)c.ultima=v.prevUltima;
    S.ventas.splice(i,1);save();render();toast("Venta deshecha. El producto volvió a tus productos")}
  else if(t.hasAttribute("data-close"))close();
  else if(d.act==="editPerfil")formPerfil();
  else if(d.act==="pickVenta")pickVenta();
  else if(d.act==="guiaCel")guiaCel();
  else if(d.act==="sendLink")window.open("https://wa.me/?text="+encodeURIComponent("Mi herramienta de inventario: "+linkApp()),"_blank","noopener");
  else if(d.act==="clearSample"){S={sample:false,vioTutorial:true,perfil:{nivel:"Bronce"},productos:[],clientes:[],ventas:[]};save();render();formPerfil(true)}
  else if(d.act==="backup")backup();
  else if(d.act==="restore")$("#restoreFile").click();
  else if(d.act==="doRestore"&&pendiente){S=pendiente;pendiente=null;save();close();tab="inicio";render();toast("Copia recuperada")}
  else if(d.act==="copyLink"){const u=linkApp();(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast("Link copiado. Pégalo en Chrome o Safari")).catch(()=>toast(u))}
});
// La búsqueda vuelve a pintar la lista; se devuelve el foco al campo para seguir escribiendo
document.addEventListener("input",e=>{const id=e.target.id;if(id!=="qInv")return;
  qInv=e.target.value;render();const el=$("#"+id);if(el){el.focus();const n=el.value.length;try{el.setSelectionRange(n,n)}catch(_){}}});
$("#sheet").addEventListener("click",e=>{if(e.target.id==="sheet")close()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
render();
// Mientras vea el ejemplo, el tutorial la recibe cada vez que abre la herramienta
if(primeraVez||S.sample||!S.vioTutorial){S.vioTutorial=true;save();tutorial(0)}
})();
</script>
